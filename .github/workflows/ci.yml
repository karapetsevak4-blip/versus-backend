name: Backend CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, feat/current-game]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked application dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run regression tests
        run: python manage.py test --settings=mysite.settings_test

      - name: Run Django checks
        run: python manage.py check --settings=mysite.settings_test

      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run --settings=mysite.settings_test
